name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.1.19
      - name: Build and test
        run: |
          platformio run -d firmware -e cardputer-adv-recorder
          platformio test -d firmware -e native-tests
          pip install uv
          cd gateway
          uv run --extra dev pytest
          cd ..
      - name: Package firmware
        run: firmware/scripts/package-release.sh "${GITHUB_REF_NAME}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/firmware/Cardputer-ADV-Agent-Console-${{ github.ref_name }}-M5Apps.bin
            release/firmware/SHA256SUMS.txt
