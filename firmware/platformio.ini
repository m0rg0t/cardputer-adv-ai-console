; Cardputer ADV Recorder

[platformio]
default_envs = cardputer-adv-recorder

[env:cardputer-adv-recorder]
platform = espressif32@7.0.1
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/sanitize_build_paths.py
build_src_filter = +<*> -<sim/>
build_flags =
    -Wl,--wrap=esp_wifi_init
    -fmerge-all-constants
lib_deps =
    m5stack/M5Unified@0.2.17
    m5stack/M5GFX@0.2.22
    z3t0/IRremote@4.7.1
    m5stack/M5Cardputer@1.1.1
    bblanchon/ArduinoJson@7.4.2

[env:native-tests]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    -<*>
    +<media/wav_format.cpp>
    +<media/file_naming.cpp>

; Desktop preview of the device UI. Renders the real draw() code through the
; M5GFX SDL backend with stubbed hardware. See sim/README.md.
[env:native-sim]
platform = native
build_type = debug
lib_deps = m5stack/M5GFX@^0.2.26
build_src_filter =
    -<*>
    +<app/recorder_ui.cpp>
    +<app/screen_saver.cpp>
    +<app/app_shared.cpp>
    +<sim/>
build_flags =
    -std=gnu++17
    -O1
    -DCARDPUTER_SIM
    -DM5GFX_BOARD=board_M5Cardputer
    -DM5GFX_SCALE=3
    -Isim/stubs
    -Iinclude
    !sdl2-config --cflags
    !sdl2-config --libs
